[package]
name = "codex-infra-provider"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
doctest = false
test = false

[lints]
workspace = true

[dependencies]
async-stream = { workspace = true }
axum = { workspace = true, features = ["http1", "json", "tokio"] }
bytes = { workspace = true }
blake3 = { workspace = true }
codex-infra-protocol = { workspace = true }
codex-infra-state = { workspace = true }
eventsource-stream = { workspace = true }
futures = { workspace = true, features = ["std"] }
reqwest = { workspace = true, features = ["stream", "json"] }
serde_json = { workspace = true }
serde = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["net", "rt", "sync"] }
