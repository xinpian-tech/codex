[package]
name = "codex-infra-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
test = false
doctest = false

[[bin]]
name = "codex-machine-runtime"
path = "src/bin/codex-machine-runtime.rs"
test = false
bench = false

[lints]
workspace = true

[dependencies]
blake3 = { workspace = true }
codex-infra-protocol = { workspace = true }
codex-infra-provider = { workspace = true }
codex-infra-state = { workspace = true }
codex-infra-tmux = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "time", "sync", "macros", "signal"] }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }
